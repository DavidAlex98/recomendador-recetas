# NGINX: muestra las páginas y manda /api a la app (reverse proxy)
# Responsable: David

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Las fotos para reconocer pueden pesar varios MB
    client_max_body_size 15m;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /docs {
        proxy_pass http://app:8000;
    }

    location /openapi.json {
        proxy_pass http://app:8000;
    }
}
