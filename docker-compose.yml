# RecetApp con Docker: NGINX -> FastAPI -> PostgreSQL
# Responsable: David

name: recetapp

services:

  db:
    container_name: recetapp-db
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - datos_db:/var/lib/postgresql/data
      - ./base_datos/crear_tablas.sql:/docker-entrypoint-initdb.d/1_crear_tablas.sql:ro
      - ./base_datos/vistas_y_procedimientos.sql:/docker-entrypoint-initdb.d/2_vistas_y_procedimientos.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10

  app:
    container_name: recetapp-app
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend

  web:
    container_name: recetapp-web
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - frontend

networks:
  frontend:
  backend:
    internal: true

volumes:
  datos_db:
