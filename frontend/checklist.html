<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>¿Qué tengo en casa? · RecetApp</title>
    <link rel="stylesheet" href="css/estilos.css?v=14">
</head>
<body>
    <!-- Responsable: Manrique -->

    <nav class="barra">
        <a class="marca" href="index.html">RecetApp</a>
        <a href="checklist.html">¿Qué tengo en casa?</a>
        <a href="login.html">Iniciar sesión</a>
    </nav>

    <main>
        <h1>¿Qué tengo en casa?</h1>
        <p>Marca lo que tienes. El aceite, el azúcar y las especias ya los contamos, van al gusto.</p>

        <div class="campo-busqueda con-camara">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.500 15.500 21 21"/></svg>
            <input id="buscador" class="buscador" type="text" placeholder="Buscar ingrediente...">
            <a class="boton-camara" href="escanear.html" aria-label="Escanear ingredientes con una foto">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.500" r="3.500"/><path d="M9 7l1.200-2h3.600L15 7"/></svg>
            </a>
        </div>

        <p id="caja-despensa" class="oculto"><button id="boton-despensa" class="boton boton-gris">Marcar lo de mi despensa</button></p>

        <div id="ingredientes">Cargando ingredientes...</div>

        <p><button id="boton-buscar" class="boton">Ver qué puedo cocinar</button></p>

        <div id="resultados"></div>
    </main>

    <script src="js/api.js?v=8"></script>
    <script src="js/checklist.js?v=14"></script>
</body>
</html>
