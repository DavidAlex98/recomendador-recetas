<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · RecetApp</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <!-- Responsable: Brandon -->

    <nav class="barra">
        <a class="marca" href="index.html">RecetApp</a>
        <a href="checklist.html">¿Qué tengo en casa?</a>
        <a href="login.html">Iniciar sesión</a>
    </nav>

    <main>
        <h1>Iniciar sesión</h1>

        <form id="formulario" class="tarjeta formulario">
            <label for="correo">Correo</label>
            <input id="correo" class="buscador" type="email" required>

            <label for="contrasena">Contraseña</label>
            <input id="contrasena" class="buscador" type="password" required>

            <button class="boton" type="submit">Entrar</button>
            <p id="mensaje" class="mensaje-error"></p>
        </form>
    </main>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
